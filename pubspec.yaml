name: university_scheduler
description: سامانه حرفه‌ای مدیریت برنامه کلاس‌ها و حضور و غیاب اساتید
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  device_info_plus: ^10.1.0
  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Excel
  excel: ^4.0.6
  spreadsheet_decoder: ^2.1.1 
  # File & Sharing
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  open_file: ^3.5.10

  # Permissions
  permission_handler: ^11.3.1

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.1.3
  fl_chart: ^0.69.2

  # Utils
  intl: any
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/images/
    - assets/animations/
